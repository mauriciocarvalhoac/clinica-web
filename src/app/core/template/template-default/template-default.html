<div class="template-default">
    @if (isInvisibleMenu) {
    <aside class="navigation">
        <div class="logo-clinic">
            <i class="fas fa-stethoscope"></i>
        </div>
        <ul class="nav flex-column">
            <span class="title">Principal</span>
            <li class="nav-item">
                <a [routerLink]="['/dashboard']" class="nav-link text-dark">
                    <i class="fas fa-house"></i> Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-dark disabled">
                    <i class="fas fa-calendar-days"></i> Agendamentos</a>
            </li>
            <li class="nav-item">
                <a [routerLink]="['/paciente-listagem']" class="nav-link text-dark">
                    <i class="fa-solid fa-user-injured"></i> Pacientes</a>
            </li>

            <span class="title">Administrativo</span>
            <li class="nav-item">
                <a [routerLink]="['/funcionario-listagem']" class="nav-link text-dark">
                    <i class="fa-solid fa-id-card"></i> Funcionários</a>
            </li>
            <li class="nav-item">
                <a [routerLink]="['/acesso-listagem']" class="nav-link text-dark">
                    <i class="fa-solid fa-user-shield"></i> Acessos</a>
            </li>
            <li class="nav-item ">
                <a class="nav-link text-dark disabled">
                    <i class="fa-solid fa-chart-line"></i> Financeiro</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-dark disabled">
                    <i class="fa-solid fa-box-open"></i> Estoque</a>
            </li>

            <span class="title">Relatórios</span>
            <li class="nav-item">
                <a class="nav-link text-dark disabled">
                    <i class="fa-solid fa-file-lines"></i> Atendimentos</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-dark disabled">
                    <i class="fas fa-user-injured"></i> Pacientes</a>
            </li>

            <span class="title">Configurações</span>
            <li class="nav-item">
                <a [routerLink]="['/cadastros-auxiliares']" class="nav-link text-dark">
                    <i class="fa-solid fa-gear"></i> Cadastros Auxiliares</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-dark disabled">
                    <i class="fa-solid fa-wrench"></i> Parametrização</a>
            </li>
        </ul>
    </aside>
    }

    <main class="content-full">
        <header class="content-header">
            <div class="hambueguer-logo">
                <a (click)="toggleMenu()" class="hamburguer-menu">
                    <i class="fa-solid fa-bars"></i>
                </a>
                <div class="nav-logo">
                    <span>MrcClínic</span>
                </div>
            </div>
            <div class="content-header-right">
                <img src="/images/user-unknown.png" alt="Foto" width="35" class="img-foto mr-10">
                <span class=""></span>

                <div ngbDropdown [autoClose]="'outside'" class="d-inline-block">
                    <button style="background: transparent;" type="button" class="font-15 btn btn-primary"
                        ngbDropdownToggle>
                        <span>Drª Alice Carvalho</span>
                    </button>

                    <div ngbDropdownMenu style="padding: 5px;">
                        <label class="font-15" style="width: 100%; text-align: center;">Versão: 1.0.0</label>
                        <button (click)="logout()" style="width: 100%;" class="btn btn-sm btn-danger">Logout</button>
                    </div>
                </div>
            </div>
        </header>
        <section class="content-main">
            <section class="content-page">
                <app-alert-component />
                <router-outlet />
            </section>
        </section>
    </main>
</div>
