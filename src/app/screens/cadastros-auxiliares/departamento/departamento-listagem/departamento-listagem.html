<header class="header-form">
    <h3>Filtragem</h3>
</header>

<form [formGroup]="formularioDepartamento">
    <div class="row d-flex justify-content-end align-items-center">
        <div class="col-5">
            <input class="form-control" formControlName="descricao" placeholder="Digite a Descrição">
        </div>
        <div class="col-5">
            <select formControlName="situacao" class="form-select">
                <option [value]="null">Selecione</option>
                @for (i of enumSituacao; track $index) {
                <option [value]="i.valor" [label]="i.descricao"></option>
                }
            </select>
        </div>
        <div class="col-2">
            <button (click)="filtrar()" class="btn btn-sm btn-search w-100">
                <i class="fas fa-filter"></i>Filtrar</button>
        </div>
    </div>
</form>

<table class="table table-striped mt-2 ">
    <thead>
        <tr>
            <th>Descrição</th>
            <th>Situação</th>
            <th>Ações</th>
        </tr>
    </thead>

    <tbody>
        @for (item of lista(); track item.id) {
        <tr>
            <td> {{ item?.descricao }} </td>
            <td>
                @if(item?.situacao === 'A'){
                <label class="situacao ativo w-100 text-center"><i class="fas fa-circle-check"></i>
                    Ativo</label>
                }@else{
                <label class="situacao inativo w-100 text-center"><i class="fas fa-circle-xmark"></i>
                    Inativo</label>
                }
            </td>
            <td style="width: 90px;">
                <a (click)="prepararEdicao(item.id)" class="btn btn-sm btn-edit">
                    <i class="fas fa-edit"></i></a>
                <a (click)="excluir(item.id)" class="btn btn-sm btn-delete">
                    <i class="fas fa-trash"></i></a>
            </td>
        </tr>
        } @empty {
        <tr>
            <td colspan="3">Nenhum departamento encontrado.</td>
        </tr>
        }
    </tbody>
</table>
