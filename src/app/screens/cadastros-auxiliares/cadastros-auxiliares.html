<div style="padding: 10px;">
    <header class="header-form">
        <div>
            <span>Configurações > Cadastros Auxiliares</span>
            <h3>Cadastros Auxiliares</h3>
        </div>
    </header>

    <section class="formulario">
        <ul ngbNav #nav="ngbNav" [(activeId)]="activeTab" class="nav-tabs">
            <li [ngbNavItem]="1">
                <button ngbNavLink>Departamentos</button>
                <ng-template ngbNavContent>
                    <section class="formulario d-flex">
                        <article class="inclusao col-6 p-2 ms-1">
                            <tab-departamento-inclusao></tab-departamento-inclusao>
                        </article>

                        <article class="tabela col-6 p-2 ms-1">
                            <tab-departamento-listagem></tab-departamento-listagem>
                        </article>
                    </section>
                </ng-template>
            </li>
            <li [ngbNavItem]="2">
                <button ngbNavLink>Dados de Pagamentos</button>
                <ng-template ngbNavContent>
                    <section class="formulario">

                        Implementação de Dados de Pagamentos
                    </section>
                </ng-template>
            </li>
        </ul>
        <div [ngbNavOutlet]="nav" class="mt-2"></div>

    </section>
</div>
