<div style="padding: 10px;">
    <header class="header-form">
        <div>
            <span>Configurações > Cadastros Auxiliares</span>
            <h3>Cadastros Auxiliares</h3>
        </div>
    </header>

    <section class="formulario">
        <article class="listagem">
            <ul class="list-group">
                <li class="list-group-item" aria-current="true">
                    <a [routerLink]="['/departamento-listagem']" (click)="isActivated()"
                        class="list-group-item list-group-item-action">
                        <i class="fa-solid fa-building-user"></i> Departamentos
                    </a>
                </li>
                <li class="list-group-item disabled">
                    <a (click)="isActivated()" class="list-group-item list-group-item-action">
                        <i class="fas fa-credit-card"></i> Dados de Pagamentos
                    </a>
                </li>
            </ul>
        </article>
    </section>
</div>
