<div class="login-container">

    <section class="login-form">
        <form [formGroup]="formulario" (ngSubmit)="login()">
            <div class="row">
                <div class="col">
                    <label>Login:</label>
                    <input formControlName="username" class="form-control">
                </div>
            </div>
            <div class="row">
                <div class="col">
                    <label>Senha:</label>
                    <input type="password" formControlName="password" class="form-control">
                </div>
            </div>

            <div class="mt-10 d-flex justify-content-end">
                <button type="submit" [disabled]="formulario.invalid" style="" class="btn btn-primary">Entrar</button>
            </div>

        </form>
    </section>

</div>
