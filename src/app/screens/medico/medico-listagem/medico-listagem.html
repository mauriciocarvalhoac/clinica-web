<div style="padding: 10px;">
    <header>
        <div style="background: #eee; padding: 10px;">
            <span>Cadastro > Médico > Listagem</span>
            <h3>Listagem de Médicos</h3>
        </div>
        <div style="background: #DDD;" class="d-flex justify-content-between">
            <div>
                <button [routerLink]="['/medico-inclusao']" class="btn btn-sm btn-add">Adicionar</button>

            </div>
            <div>
                <button (click)="limpar()" class="btn btn-sm btn-reset" style="margin-right: 10px;">Limpar</button>
                <button (click)="filtrar()" class="btn btn-sm btn-search">Pesquisar</button>

            </div>
        </div>
    </header>

    <section class="formulario">
        <article class="pesquisa">
            <form [formGroup]="formulario">
                <div class="row">
                    <div class="col">
                        <label>Nome:</label>
                        <input formControlName="nome" class="form-control">
                    </div>
                    <div class="col-3">
                        <label>CPF:</label>
                        <input formControlName="cpf" mask="000.000.000-00" placeholder="000.000.000-00"
                            class="form-control">
                    </div>
                </div>

            </form>
        </article>

        <article class="tabela">
            <h4>{{listaSize()}} itens encontrados</h4>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>
                            Nome do médico
                        </th>
                        <th class="text-center">
                            CPF
                        </th>
                        <th class="">
                            Email
                        </th>
                    </tr>
                </thead>
                <tbody>
                    @for (item of lista(); track item.id) {
                    <tr>
                        <td>{{item.nome}}</td>
                        <td style="width: 130px;">{{item.cpf | cpf}} </td>
                        <td style="width: 30%;"> {{item.email}}</td>
                    </tr>
                    } @empty {
                    <tr>
                        <td colspan="3">Nenhum médico encontrado.</td>
                    </tr>
                    }
                </tbody>
            </table>
        </article>
    </section>
</div>
