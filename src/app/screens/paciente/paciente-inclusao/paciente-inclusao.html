<div style="padding: 10px;">
    <header class="header-form">
        <div>
            <span>Cadastro > Paciente > Inclusão</span>
            <h3>Inclusão de Pacientes</h3>
        </div>
        <div class="navegacao d-flex justify-content-between">
            <div>
                <button [routerLink]="['/paciente-listagem']" class="btn btn-sm btn-add">
                    <i class="fas fa-chevron-left"></i> Voltar</button>
            </div>
            <div>
                <button (click)="limpar()" class="ml-10 btn btn-sm btn-clean">
                    <i class="fas fa-broom"></i> Limpar</button>
                @if(isCRUD == "R"){
                <button (click)="habilitarCampos()" class="ml-10 btn btn-sm btn-clean">
                    <i class="fas fa-broom"></i> Habilitar Campos</button>
                }
                @if (formulario.get('id')?.value && isCRUD == "U") {
                <button (click)="cancelar()" class="ml-10 btn btn-sm btn-cancel">
                    <i class="fa-solid fa-xmark"></i> Cancelar</button>
                }
                <button (click)="salvar()" class="ml-10 btn btn-sm btn-search">
                    <i class="fas fa-floppy-disk"></i> Salvar</button>
            </div>
        </div>
    </header>

    <section class="formulario">
        <form [formGroup]="formulario">
            <section class="formulario">
                <article class="inclusao">
                    <h6>Identificação</h6>
                    <div class="d-flex">
                        <div class="col-2">
                            <div
                                style="border: 1px solid #ddd;padding: 10px; height: 100%; display: flex;justify-content: center; text-align: center;">
                                <img src="/images/user-unknown.png" style="margin: 10px;">
                            </div>
                        </div>
                        <div class="col" style="padding: 10px;">
                            <div class="row">
                                <div class="col">
                                    <label>Nome*:</label>
                                    <input formControlName="nome" maxlength="200" class="form-control"
                                        [ngClass]="{ 'is-invalid': hasNotValidated('nome')}">
                                </div>
                                <div class="col-3">
                                    <label>CPF*:</label>
                                    <input formControlName="cpf" mask="000.000.000-00" placeholder="000.000.000-00"
                                        class="form-control" [ngClass]="{ 'is-invalid': hasNotValidated('cpf')}">
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-3">
                                    <label>RG:</label>
                                    <input formControlName="rg" maxlength="20" class="form-control">
                                </div>
                                <div class="col-3">
                                    <label>Data Nascimento*:</label>
                                    <input formControlName="dataNascimento" type="date" class="form-control"
                                        [ngClass]="{ 'is-invalid': hasNotValidated('dataNascimento')}">
                                </div>
                                <div class="col-3">
                                    <label>Genero:</label>
                                    <select formControlName="genero" class="form-select">
                                        <option [value]="null">Selecione</option>
                                        @for (i of enumGeneros; track $index) {
                                        <option [value]="i.sigla" [label]="i.descricao"></option>
                                        }
                                    </select>
                                </div>
                                <div class="col-3">
                                    <label>Pais Origem:</label>
                                    <select formControlName="paisOrigem" class="form-select">
                                        <option [value]="null">Selecione</option>
                                        @for(p of enumPais; track $index) {
                                        <option [value]="p.sigla" [label]="p.descricao"></option>
                                        }
                                    </select>
                                </div>
                            </div>

                            <div class="row">
                                <div class=" col">
                                    <label>Email*:</label>
                                    <input formControlName="email" maxlength="100" class="form-control"
                                        [ngClass]="{ 'is-invalid': hasNotValidated('email')}">
                                </div>
                                <div class="col-3">
                                    <label>Celular*:</label>
                                    <input formControlName="celular" mask="(00) 00000-0000"
                                        placeholder="(00) 00000-0000" class="form-control"
                                        [ngClass]="{ 'is-invalid': hasNotValidated('celular')}">
                                </div>
                                <div class="col-3">
                                    <label>Telefone:</label>
                                    <input formControlName="telefone" mask="(00) 0000-0000 || (00) 00000-0000"
                                        placeholder="(00) 0000-0000" class="form-control">
                                </div>
                            </div>
                        </div>
                    </div>
                </article>

                <article class="inclusao">
                    <h6>Dados de Endereço</h6>
                    <div class="row" formGroupName="endereco">
                        <div class="row">
                            <div class="col-2">
                                <label>CEP:</label>
                                <input formControlName="cep" (keyup)="onConsultarCEP()" mask="00000-000"
                                    placeholder="00000-000" class="form-control">
                            </div>
                            <div class="col-2">
                                <label>Estado:</label>
                                <select formControlName="estado" class="form-select">
                                    <option [value]="null">Selecione</option>
                                    @for( e of enumEstados; track $index) {
                                    <option [value]="e.sigla" [label]="e.descricao">
                                        }
                                </select>
                            </div>
                            <div class="col">
                                <label>Cidade:</label>
                                <input formControlName="cidade" class="form-control">
                            </div>
                            <div class="col">
                                <label>Bairro:</label>
                                <input formControlName="bairro" class="form-control">
                            </div>
                        </div>

                        <div class="row">
                            <div class="col">
                                <label>Logradouro:</label>
                                <input formControlName="logradouro" class="form-control">
                            </div>
                            <div class="col-1">
                                <label>Número:</label>
                                <input formControlName="numero" maxlength="5" class="form-control">
                            </div>
                            <div class="col">
                                <label>Complemento:</label>
                                <input formControlName="complemento" class="form-control">
                            </div>
                        </div>
                    </div>
                </article>
            </section>
        </form>
    </section>
</div>
