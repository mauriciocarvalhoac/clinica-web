<div style="padding: 10px;">
    <header class="header-form d-flex justify-content-between">
        <div>
            <span>Cadastro > Paciente > Listagem</span>
            <h3>Listagem de Pacientes</h3>
        </div>
        <div>
            <button [routerLink]="['/paciente-inclusao']" class="btn btn-sm btn-add w-100">
                <i class="fas fa-plus"></i> Novo Paciente</button>
        </div>
    </header>

    <section class="formulario">
        <form [formGroup]="formulario">
            <article class="tabela">
                <div class="row d-flex justify-content-end align-items-center">
                    <div class="col-4">
                        <input placeholder="Buscar o nome" formControlName="nome" class="form-control">
                    </div>
                    <div class="col-2">
                        <input formControlName="cpf" mask="000.000.000-00" placeholder="000.000.000-00"
                            class="form-control">
                    </div>
                    <div class="col-1">
                        <button (click)="filtrar()" class="btn btn-sm btn-search w-100">
                            <i class="fas fa-filter"></i> Filtrar</button>
                    </div>
                    <div class="col-1">
                        <button (click)="limpar()" class="btn btn-sm btn-clean w-100" style="margin-right: 10px;">
                            <i class="fas fa-broom"></i> Limpar</button>

                    </div>
                </div>

                <h4>{{lista().length}} pacientes encontrados</h4>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th> Nome do paciente </th>
                            <th> CPF </th>
                            <th> Email </th>
                            <th> Ação </th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (item of lista(); track item.id) {
                        <tr>
                            <td> {{item.nome}} </td>
                            <td style="width: 130px;"> {{item.cpf | cpf}} </td>
                            <td style="width: 30%;"> {{item.email}} </td>
                            <td style="width: 90px;">
                                <a (click)="irParaEdicao(item)" class="btn btn-sm btn-edit">
                                    <i class="fas fa-edit"></i></a>
                                <a (click)="excluir(item)" class="btn btn-sm btn-delete">
                                    <i class="fas fa-trash"></i></a>
                            </td>
                        </tr>
                        } @empty {
                        <tr>
                            <td colspan="3">Nenhum paciente encontrado.</td>
                        </tr>
                        }
                    </tbody>
                </table>
            </article>
        </form>
    </section>
</div>
