<div style="padding: 10px;">
    <header class="header-form d-flex justify-content-between">
        <div>
            <span>Cadastro > Agenda > Listagem</span>
            <h3>Listagem de Agendas</h3>
        </div>
        <div>
            <button [routerLink]="['/agenda-inclusao']" class="btn btn-sm btn-add w-100">
                <i class="fas fa-plus"></i> Nova Agenda</button>
        </div>
    </header>

    <section class="formulario">
        <form [formGroup]="formulario">
            <article class="tabela">
                <div class="row d-flex justify-content-end align-items-center">
                    <div class="col-4">
                        <input placeholder="Digite o nome da agenda..." formControlName="descricao"
                            class="form-control">
                    </div>

                    <div class="col-1">
                        <button (click)="filtrar()" class="btn btn-sm btn-search w-100">
                            <i class="fas fa-filter"></i> Filtrar</button>
                    </div>
                    <div class="col-1">
                        <button (click)="limpar()" class="btn btn-sm btn-clean w-100" style="margin-right: 10px;">
                            <i class="fas fa-broom"></i> Limpar</button>
                    </div>
                </div>

                <h4>{{lista().length}} agendas encontradas</h4>
                <table class="table table-striped">
                    <thead>
                        <tr>
                            <th> Nome da Agenda </th>
                            <th> Médico </th>
                            <!-- <th> Dias da Semana </th> -->
                            <th> Ação </th>
                        </tr>
                    </thead>
                    <tbody>
                        @for (obj of lista() ; track obj.id) {
                        <tr>
                            <td> {{obj?.descricao}} </td>
                            <td> {{obj?.funcionario?.nome}} </td>
                            <!-- <td>
                                @for (item of obj?.atendimentos; track $index) {
                                <span> {{ item?.dia}} </span>
                                }
                            </td> -->
                            <td style="width: 90px;">
                                <a (click)="navigateTo(  '/agenda-inclusao' , obj.id)" class="btn btn-sm btn-edit">
                                    <i class="fas fa-edit"></i></a>
                                <a (click)="excluir(obj.id)" class="btn btn-sm btn-delete">
                                    <i class="fas fa-trash"></i></a>
                            </td>
                        </tr>
                        } @empty {
                        <tr>
                            <td colspan="3">Nenhuma agenda encontrada.</td>
                        </tr>
                        }
                    </tbody>
                </table>
            </article>
        </form>
    </section>
</div>
