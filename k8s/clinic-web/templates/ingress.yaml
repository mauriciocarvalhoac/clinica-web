apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: angular-ingress
  annotations:
    ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
  - host: clinic-app.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: clinic-web-service
            port:
              number: 80